name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same script as the local pre-commit hook, run on every tracked file.
      - name: Block Cyrillic text
        run: sh .githooks/pre-commit --all
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST
        run: npm install -g mystmd@1.12.0
      - name: Build HTML
        working-directory: book
        run: myst build --html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/_build/html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
